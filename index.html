<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gold Trading Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.0.2/build/global/luxon.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        .chart-container {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border: 1px solid #334155;
        }
        
        .signal-indicator {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="p-4">
    <div class="container mx-auto max-w-7xl">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-500">AI Gold Trading Platform</h1>
            <div class="flex items-center gap-4">
                <span class="px-3 py-1 bg-slate-800 rounded-full text-sm">XAUUSD</span>
                <span id="currentPrice" class="text-xl font-bold">1923.45</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Main Chart Section -->
            <div class="lg:col-span-2 chart-container p-4">
                <canvas id="goldChart" height="400"></canvas>
            </div>

            <!-- Trading Controls -->
            <div class="space-y-6">
                <!-- Signal Panel -->
                <div class="bg-slate-800 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold mb-3">Next Signal</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-700 p-3 rounded">
                            <span class="block text-sm text-slate-400">Direction</span>
                            <span id="signalDirection" class="text-green-500 font-bold">BUY</span>
                        </div>
                        <div class="bg-slate-700 p-3 rounded">
                            <span class="block text-sm text-slate-400">Confidence</span>
                            <span id="confidence" class="text-yellow-500 font-bold">92%</span>
                        </div>
                        <div class="bg-slate-700 p-3 rounded">
                            <span class="block text-sm text-slate-400">Entry</span>
                            <span id="entryPrice" class="font-bold">1923.50</span>
                        </div>
                        <div class="bg-slate-700 p-3 rounded">
                            <span class="block text-sm text-slate-400">Take Profit</span>
                            <span id="takeProfit" class="font-bold">1925.00</span>
                        </div>
                    </div>
                </div>

                <!-- Trading Controls -->
                <div class="bg-slate-800 p-4 rounded-lg">
                    <div class="grid grid-cols-2 gap-3">
                        <button id="startAuto" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">
                            Start Auto
                        </button>
                        <button id="stopAuto" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded">
                            Stop Auto
                        </button>
                        <button id="buyManual" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                            Manual Buy
                        </button>
                        <button id="sellManual" class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded">
                            Manual Sell
                        </button>
                    </div>
                </div>

                <!-- Profit Target -->
                <div class="bg-slate-800 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold mb-3">Daily Profit Target</h3>
                    <div class="space-y-3">
                        <input type="range" id="profitTarget" min="1" max="100" value="5" 
                               class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between">
                            <span id="targetValue" class="font-bold text-yellow-500">5%</span>
                            <span id="currentProfit" class="font-bold text-green-500">+2.3%</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-2.5">
                            <div id="progressBar" class="bg-yellow-500 h-2.5 rounded-full" style="width: 45%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trade History -->
        <div class="mt-6 bg-slate-800 rounded-lg p-4">
            <h3 class="text-lg font-semibold mb-3">Trade History</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-slate-400">
                            <th class="text-left p-2">Time</th>
                            <th class="text-left p-2">Type</th>
                            <th class="text-left p-2">Entry</th>
                            <th class="text-left p-2">Exit</th>
                            <th class="text-left p-2">Profit</th>
                        </tr>
                    </thead>
                    <tbody id="tradeHistory">
                        <!-- Trade history will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Initialize Chart
        const ctx = document.getElementById('goldChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'candlestick',
            data: {
                datasets: [{
                    label: 'XAUUSD',
                    data: []
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });

        // Simulate real-time data
        let currentPrice = 1923.45;
        setInterval(() => {
            currentPrice += (Math.random() - 0.5) * 0.2;
            document.getElementById('currentPrice').textContent = currentPrice.toFixed(2);
            // Update chart data here
        }, 1000);

        // Trading Controls
        document.getElementById('startAuto').addEventListener('click', () => {
            // Implement auto trading logic
            alert('Auto trading started');
        });

        document.getElementById('stopAuto').addEventListener('click', () => {
            // Stop auto trading logic
            alert('Auto trading stopped');
        });

        // Profit Target Slider
        const profitSlider = document.getElementById('profitTarget');
        profitSlider.addEventListener('input', (e) => {
            document.getElementById('targetValue').textContent = `${e.target.value}%`;
            // Update trading parameters based on target
        });

        // Sample trade history
        function addTradeToHistory(trade) {
            const tbody = document.getElementById('tradeHistory');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="p-2">${trade.time}</td>
                <td class="p-2 ${trade.type === 'BUY' ? 'text-green-500' : 'text-red-500'}">${trade.type}</td>
                <td class="p-2">${trade.entry}</td>
                <td class="p-2">${trade.exit}</td>
                <td class="p-2 ${trade.profit > 0 ? 'text-green-500' : 'text-red-500'}">${trade.profit}</td>
            `;
            tbody.prepend(row);
        }

        // Add sample trade
        addTradeToHistory({
            time: '14:30:22',
            type: 'BUY',
            entry: '1923.45',
            exit: '1924.00',
            profit: '+$55'
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
